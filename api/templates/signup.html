{% extends 'base.html' %}

{% block title %}Sign Up | ByteScribe{% endblock %}

{% block content %}
  <div class="auth-container">
    <div class="auth-header">
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join the ByteScribe community today</p>
    </div>

    <form action="{{ url_for('signup') }}" method="POST">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-control" required placeholder="Pick a username" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" required placeholder="Enter your email" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" required placeholder="Choose a password" autocomplete="off">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 32px;">Create Account</button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="{{ url_for('login') }}" class="auth-link">Login</a></p>
    </div>
  </div>
{% endblock %}
