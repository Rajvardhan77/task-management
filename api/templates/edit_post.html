{% extends 'base.html' %}

{% block title %}Edit Post | {{ post.title }} | ByteScribe{% endblock %}

{% block content %}
  <div class="post-detail-container" style="max-width: 680px;">
    <!-- Back Link -->
    <a href="{{ url_for('post_detail', post_id=post.id) }}" class="read-more" style="display: inline-flex; margin-bottom: 24px; color: var(--text-muted); font-size: 0.9rem; transform: rotate(180deg); flex-direction: row-reverse; gap: 8px;">
      <span style="transform: rotate(180deg); display: inline-block;">Back to Post</span>
    </a>

    <div class="comment-form-container">
      <h2 style="font-size: 1.8rem; margin-bottom: 8px; font-weight: 700;">Edit Article</h2>
      <p style="color: var(--text-secondary); margin-bottom: 32px; font-size: 0.95rem;">Update your article details below.</p>

      <form action="{{ url_for('edit_post', post_id=post.id) }}" method="POST">
        <div class="form-group">
          <label for="title" class="form-label">Post Title</label>
          <input type="text" id="title" name="title" class="form-control" value="{{ post.title }}" required autocomplete="off">
        </div>
        
        <div class="form-group">
          <label for="content" class="form-label">Body Content</label>
          <textarea id="content" name="content" class="form-control" style="min-height: 250px;" required>{{ post.content }}</textarea>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 32px;">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="{{ url_for('post_detail', post_id=post.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
